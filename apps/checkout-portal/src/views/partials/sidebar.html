    <!-- PC LEFT SIDEBAR (Razorpay 2-Column Exact Layout for Desktop) -->
    <aside class="ypg-pc-sidebar">
      <div>
        <!-- Merchant Brand Header -->
        <div class="ypg-pc-brand-header">
          <div class="ypg-pc-avatar" id="pcMerchantAvatarBox">
            <span id="pcMerchantAvatarLetter">P</span>
            <img id="pcMerchantAvatarImg" alt="Logo" style="display:none;" />
          </div>
          <div class="ypg-pc-brand-info">
            <div class="ypg-pc-merchant-name" id="pcMerchantName">{{MERCHANT_NAME}}</div>
            <div class="ypg-pc-trust-badge" id="pcTrustBadge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="#22c55e">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
              </svg>
              <span id="pcTrustBadgeText">Trusted Business</span>
            </div>
          </div>
        </div>

        <!-- Social Proof Banner -->
        <div class="ypg-pc-social-proof" id="pcSocialProofWrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg>
          <span id="pcSocialProofText">500+ orders last month from {{MERCHANT_NAME}}</span>
        </div>

        <!-- Price Summary & Order Details White Card -->
        <div class="ypg-pc-price-card">
          <div class="ypg-pc-price-label">Amount to Pay</div>
          <div class="ypg-pc-price-val" id="pcPriceSummaryAmount">₹{{AMOUNT}}</div>

          <div class="ypg-pc-order-details-toggle" onclick="togglePcOrderDetails()">
            <span>Order Details</span>
            <svg id="pcOrderChevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
          <div class="ypg-pc-order-details-box" id="pcOrderDetailsBox">
            <div class="ypg-pc-order-item-row">
              <span style="display:flex; align-items:center; gap:6px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg> <span id="pcOrderDescription">Test Payment</span></span>
              <span id="pcOrderItemPrice">₹{{AMOUNT}}</span>
            </div>
            <div class="ypg-pc-order-total-row">
              <span>Total Amount</span>
              <span id="pcOrderTotalAmount">₹{{AMOUNT}}</span>
            </div>
          </div>
        </div>

        <!-- Secure & Encrypted Payments Box -->
        <div class="ypg-pc-secure-box">
          <div class="ypg-pc-secure-icon-wrap">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <div>
            <div class="ypg-pc-secure-title">Secure &amp; Encrypted Payments</div>
            <div class="ypg-pc-secure-subtitle">Powered by <strong id="pcAppNameBrand">Razorpay</strong></div>
          </div>
        </div>
      </div>

      <!-- Bottom Isometric Graphic & Razorpay Security Trust Badge -->
      <div style="margin-top:auto;">
        <div class="ypg-pc-bags-wrap">
          <svg viewBox="0 0 260 160" width="220" height="130" fill="none">
            <ellipse cx="130" cy="145" rx="100" ry="12" fill="rgba(0,0,0,0.18)" />
            <!-- White / Cyan shopping bag with blue handles -->
            <path d="M100 65 L135 60 L145 135 L90 140 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
            <path d="M100 65 L135 60 L140 85 L95 90 Z" fill="#f1f5f9" />
            <path d="M110 63 C110 48, 125 48, 125 61" stroke="#0c6cf2" stroke-width="3" fill="none"
              stroke-linecap="round" />
            <!-- Green checkmark circle on bags -->
            <circle cx="170" cy="115" r="16" fill="#22c55e" />
            <path d="M163 115 l5 5 9-9" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          </svg>
        </div>
        <div class="ypg-pc-bottom-secured">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Secured by <strong>Razorpay Standard</strong></span>
        </div>
      </div>
    </aside>
